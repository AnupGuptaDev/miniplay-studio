<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6ff"><title>Snake Rush — MiniPlay Studio</title>
<style>
:root{color-scheme:light;--bg:#f3f6ff;--panel:#ffffff;--panel2:#eaf0ff;--ink:#18243a;--muted:#63718a;--accent:#087f70;--gold:#f0a43a;--line:#dce4f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#dce8ff 0,#f3f6ff 58%);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:25px 14px}
main{width:min(760px,100%)}a{color:var(--accent);text-decoration:none}.back{display:inline-block;margin:4px 0 18px;color:var(--muted)}header{text-align:center;margin-bottom:20px}.brand{font-size:.75rem;letter-spacing:.18em;color:var(--accent);font-weight:850}.brand span{color:var(--muted)}h1{font-size:clamp(2rem,6vw,3.1rem);margin:7px 0;letter-spacing:-.05em}.sub{color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,#ffffff,#f6f8ff);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 55px #0005}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#f3f6ff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:82px}.stat small{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:1.2rem;font-variant-numeric:tabular-nums}button,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--accent);color:#ffffff}.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}.message{text-align:center;color:var(--muted);min-height:27px;margin:15px 0 0}.message strong{color:var(--accent)}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin:14px 3px 0}
@media(max-width:480px){body{padding:16px 9px}.panel{padding:12px}.stat{min-width:70px;padding:7px}.bar{align-items:stretch}.bar .stats{width:100%}}
</style></head><body><main>
<a class="back" href="../../">← Back to MiniPlay Studio</a>
<header><div class="brand">MINIPLAY <span>STUDIO</span></div><h1>Snake Rush</h1><p class="sub">Collect, grow and see how long you can survive.</p></header>

<section class="panel">
 <div class="bar"><div class="stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Best</small><strong id="best">0</strong></div></div><div><button class="secondary" id="restart">↻ Restart</button></div></div>
 <canvas id="game" width="480" height="480" aria-label="Snake game board" style="display:block;width:min(100%,480px);aspect-ratio:1;margin:auto;background:#0d1928;border:1px solid #34465f;border-radius:14px;touch-action:none"></canvas>
 <div class="message" id="message">Use arrow keys or WASD. On mobile, swipe the board.</div>
 <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="secondary" data-dir="up">↑</button><button class="secondary" data-dir="left">←</button><button class="secondary" data-dir="down">↓</button><button class="secondary" data-dir="right">→</button></div>
</section>
<div class="foot"><span>MiniPlay Studio · Browser game</span><span><a href="../../">More games</a></span></div>
</main><script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),msg=document.querySelector('#message');const n=20,cell=24;let snake,dir,next,food,score,timer,over;
const key='miniplay-snake-best';bestEl.textContent=localStorage.getItem(key)||'0';
function foodPos(){let p;do{p={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}}while(snake.some(s=>s.x===p.x&&s.y===p.y));return p}
function reset(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};next=dir;food=foodPos();score=0;over=false;scoreEl.textContent='0';msg.textContent='Use arrow keys or WASD. On mobile, swipe the board.';draw();timer=setInterval(tick,115)}
function setDir(d){if(d.x!==-dir.x||d.y!==-dir.y)next=d}
function tick(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=n||h.y<0||h.y>=n||snake.slice(0,-1).some(s=>s.x===h.x&&s.y===h.y)){end();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;scoreEl.textContent=score;food=foodPos();if(score>Number(localStorage.getItem(key)||0)){localStorage.setItem(key,score);bestEl.textContent=score}}else snake.pop();draw()}
function end(){over=true;clearInterval(timer);msg.innerHTML='<strong>Game over!</strong> Your score: '+score+'. Press Restart to play again.'}
function draw(){ctx.clearRect(0,0,480,480);ctx.fillStyle='#0d1928';ctx.fillRect(0,0,480,480);ctx.strokeStyle='#1c2b40';for(let i=0;i<=n;i++){ctx.beginPath();ctx.moveTo(i*cell,0);ctx.lineTo(i*cell,480);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*cell);ctx.lineTo(480,i*cell);ctx.stroke()}ctx.fillStyle='#ffc978';ctx.beginPath();ctx.arc(food.x*cell+12,food.y*cell+12,8,0,Math.PI*2);ctx.fill();snake.forEach((s,i)=>{ctx.fillStyle=i?'#4bb99b':'#80e0c0';ctx.beginPath();ctx.roundRect(s.x*cell+2,s.y*cell+2,20,20,6);ctx.fill()})}
const dirs={ArrowUp:{x:0,y:-1},w:{x:0,y:-1},ArrowDown:{x:0,y:1},s:{x:0,y:1},ArrowLeft:{x:-1,y:0},a:{x:-1,y:0},ArrowRight:{x:1,y:0},d:{x:1,y:0}};document.addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();setDir(dirs[e.key])}});document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>setDir(({up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}})[b.dataset.dir]));let start=null;c.addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});c.addEventListener('touchend',e=>{if(!start)return;const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});start=null},{passive:true});document.querySelector('#restart').onclick=reset;reset()})();
</script></body></html>
