<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f6ff"><title>Star Catcher — MiniPlay Studio</title>
<style>
:root{color-scheme:light;--bg:#f3f6ff;--panel:#ffffff;--panel2:#eaf0ff;--ink:#18243a;--muted:#63718a;--accent:#087f70;--gold:#f0a43a;--line:#dce4f2}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#dce8ff 0,#f3f6ff 58%);font-family:Inter,system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;padding:25px 14px}
main{width:min(760px,100%)}a{color:var(--accent);text-decoration:none}.back{display:inline-block;margin:4px 0 18px;color:var(--muted)}header{text-align:center;margin-bottom:20px}.brand{font-size:.75rem;letter-spacing:.18em;color:var(--accent);font-weight:850}.brand span{color:var(--muted)}h1{font-size:clamp(2rem,6vw,3.1rem);margin:7px 0;letter-spacing:-.05em}.sub{color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,#ffffff,#f6f8ff);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 55px #0005}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:16px}.stats{display:flex;gap:9px;flex-wrap:wrap}.stat{background:#f3f6ff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:82px}.stat small{display:block;color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.1em}.stat strong{font-size:1.2rem;font-variant-numeric:tabular-nums}button,select{font:inherit}button{border:0;border-radius:11px;padding:10px 14px;font-weight:800;cursor:pointer;transition:filter .15s,transform .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--accent);color:#ffffff}.secondary{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px}.message{text-align:center;color:var(--muted);min-height:27px;margin:15px 0 0}.message strong{color:var(--accent)}.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:.78rem;margin:14px 3px 0}
@media(max-width:480px){body{padding:16px 9px}.panel{padding:12px}.stat{min-width:70px;padding:7px}.bar{align-items:stretch}.bar .stats{width:100%}}
</style></head><body><main>
<a class="back" href="../../">← Back to MiniPlay Studio</a>
<header><div class="brand">MINIPLAY <span>STUDIO</span></div><h1>Star Catcher</h1><p class="sub">Catch falling stars, avoid rocks and beat your high score.</p></header>

<section class="panel"><div class="bar"><div class="stats"><div class="stat"><small>Score</small><strong id="score">0</strong></div><div class="stat"><small>Lives</small><strong id="lives">3</strong></div><div class="stat"><small>Best</small><strong id="best">0</strong></div></div><button class="secondary" id="restart">↻ Restart</button></div>
<canvas id="game" width="480" height="560" style="display:block;width:min(100%,420px);height:auto;margin:auto;background:#0d1928;border:1px solid #34465f;border-radius:14px;touch-action:none" aria-label="Star catcher game"></canvas>
<p class="message" id="message">Move with ← → or A/D. On mobile, drag your basket. Catch stars and avoid rocks!</p>
<div style="display:flex;justify-content:center;gap:10px;margin-top:10px"><button class="secondary" id="left">← Left</button><button class="secondary" id="right">Right →</button></div></section>
<div class="foot"><span>MiniPlay Studio · Browser game</span><span><a href="../../">More games</a></span></div>
</main><script>
(()=>{const c=document.querySelector('#game'),ctx=c.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),msg=document.querySelector('#message'),key='miniplay-star-best';let player,items,score,lives,keys={},raf,last,over;bestEl.textContent=localStorage.getItem(key)||'0';
function reset(){cancelAnimationFrame(raf);player={x:215,y:510,w:50,h:18};items=[];score=0;lives=3;over=false;last=0;scoreEl.textContent=0;livesEl.textContent=3;msg.textContent='Move with ← → or A/D. On mobile, drag your basket. Catch stars and avoid rocks!';raf=requestAnimationFrame(loop)}
function spawn(){items.push({x:12+Math.random()*456,y:-20,v:2+Math.random()*2+(score/100),type:Math.random()<.72?'star':'rock',r:10})}
function draw(){ctx.clearRect(0,0,480,560);ctx.fillStyle='#0d1928';ctx.fillRect(0,0,480,560);for(let i=0;i<45;i++){ctx.fillStyle='#8ca4c2';ctx.globalAlpha=.2+(i%3)*.15;ctx.fillRect((i*73)%480,(i*127)%560,2,2)}ctx.globalAlpha=1;ctx.fillStyle='#80e0c0';ctx.beginPath();ctx.roundRect(player.x,player.y,player.w,player.h,8);ctx.fill();ctx.fillStyle='#d6fff1';ctx.fillRect(player.x+8,player.y-5,player.w-16,5);items.forEach(it=>{ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText(it.type==='star'?'⭐':'🪨',it.x,it.y)})}
function loop(t){if(over)return;const dt=Math.min((t-last)/16||1,2);last=t;if(Math.random()<.025)spawn();if(keys.left)player.x-=5*dt;if(keys.right)player.x+=5*dt;player.x=Math.max(0,Math.min(480-player.w,player.x));items.forEach(it=>it.y+=it.v*dt);items=items.filter(it=>{if(it.y>player.y-4&&it.y<player.y+player.h+15&&it.x>player.x-8&&it.x<player.x+player.w+8){if(it.type==='star'){score+=10;scoreEl.textContent=score;if(score>Number(localStorage.getItem(key)||0)){localStorage.setItem(key,score);bestEl.textContent=score}}else{lives--;livesEl.textContent=lives;if(lives<=0)end()}return false}return it.y<580});draw();if(!over)raf=requestAnimationFrame(loop)}
function end(){over=true;msg.innerHTML='<strong>Game over!</strong> Final score: '+score+'. Press Restart to play again.'}
document.addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key)){keys.left=true;e.preventDefault()}if(['ArrowRight','d','D'].includes(e.key)){keys.right=true;e.preventDefault()}});document.addEventListener('keyup',e=>{if(['ArrowLeft','a','A'].includes(e.key))keys.left=false;if(['ArrowRight','d','D'].includes(e.key))keys.right=false});document.querySelector('#left').onpointerdown=()=>keys.left=true;document.querySelector('#left').onpointerup=()=>keys.left=false;document.querySelector('#right').onpointerdown=()=>keys.right=true;document.querySelector('#right').onpointerup=()=>keys.right=false;c.addEventListener('pointermove',e=>{if(e.buttons){const r=c.getBoundingClientRect();player.x=(e.clientX-r.left)*480/r.width-player.w/2}});document.querySelector('#restart').onclick=reset;reset()})();
</script></body></html>
